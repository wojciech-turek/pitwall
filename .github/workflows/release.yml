name: Release

on:
  push:
    tags: ['v*']

# The builds only read the repository; the last job alone publishes the release.
permissions:
  contents: read

jobs:
  # Fails in seconds, before anything is built, if the tag and the changelog don't line up.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package.json and CHANGELOG has notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi
          node scripts/release-notes.mjs "$VERSION" > notes.md
          test -s notes.md || { echo "CHANGELOG has no notes for $VERSION" >&2; exit 1; }
          # The heading carries the release date, not a placeholder such as "Unreleased".
          V_RE="$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')"
          grep -Eq "^## \[$V_RE\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\s*$" CHANGELOG.md || {
            echo "CHANGELOG's ## [$VERSION] heading needs the release date (## [$VERSION] - YYYY-MM-DD)" >&2
            exit 1
          }

  mac:
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: brew install tmux
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm dist
      - run: pnpm verify:sign
      - name: Check the app inside the DMG
        run: sh scripts/verify-dmg.sh "release/Pitwall-${GITHUB_REF_NAME#v}-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: release/Pitwall-*-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  # Both installers build on x64 Windows: node-pty's arm64 binaries come prebuilt, so nothing is compiled. CI also
  # builds and runs the arm64 one on Windows on ARM. No secrets here.
  windows:
    needs: check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # What only Windows proves (the PowerShell hook and status line, cmd.exe, taskkill), before anything ships.
      - name: Windows-only unit tests
        run: pnpm exec vitest run tests/main/windows-scripts.test.ts tests/main/windows-only.test.ts
      - run: pnpm dist:win --${{ matrix.arch }}
      - name: Check the installer and the app in it
        run: node scripts/verify-windows.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: release/Pitwall-*-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$VERSION" > notes.md
          FILES="dist/Pitwall-${VERSION}-arm64.dmg dist/Pitwall-${VERSION}-x64-setup.exe dist/Pitwall-${VERSION}-arm64-setup.exe"
          for f in $FILES; do
            test -s "$f" || { echo "Missing $f" >&2; exit 1; }
          done
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $FILES --title "Pitwall ${VERSION}" --notes-file notes.md $PRERELEASE
