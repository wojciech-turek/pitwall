set -g prefix None
unbind-key -a -T prefix
set -g status off
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g extended-keys on
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB:extkeys:clipboard'
set -g window-size latest
set -g remain-on-exit off

# Selecting with the mouse. tmux's default copies on release and drops the highlight at once; here the text is copied
# and stays highlighted until a click or a key, and that key still reaches the program (as in any terminal).
# Only these keys exist while selecting or scrolled back: any other key leaves that mode and is typed (`Any` also
# matches mouse events with no binding, which are ignored). The pause before a double-click's copy lets the redraw
# finish: tmux drops the clipboard write while one is pending.
set -g mode-keys emacs
unbind-key -a -T copy-mode
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode Any { if-shell -F '#{==:#{mouse_x},}' { send-keys -X cancel ; send-keys } }
bind-key -T copy-mode WheelUpPane { select-pane ; send-keys -X -N 5 scroll-up }
bind-key -T copy-mode WheelDownPane { select-pane ; send-keys -X -N 5 scroll-down }
bind-key -T copy-mode PPage send-keys -X page-up
bind-key -T copy-mode NPage send-keys -X page-down
# A click drops the highlight; scrolled back it keeps the place, at the bottom it goes back to live output.
bind-key -T copy-mode MouseDown1Pane { select-pane ; if-shell -F -t = '#{scroll_position}' { send-keys -X clear-selection } { send-keys -X cancel } }
bind-key -T copy-mode MouseDrag1Pane { select-pane ; send-keys -X begin-selection }
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind-key -T copy-mode DoubleClick1Pane { select-pane ; send-keys -X select-word ; run-shell -d 0.1 ; send-keys -X copy-pipe-no-clear }
bind-key -T copy-mode TripleClick1Pane { select-pane ; send-keys -X select-line ; run-shell -d 0.1 ; send-keys -X copy-pipe-no-clear }
bind-key -T root DoubleClick1Pane { select-pane -t = ; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.1 ; send-keys -X copy-pipe-no-clear } }
bind-key -T root TripleClick1Pane { select-pane -t = ; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.1 ; send-keys -X copy-pipe-no-clear } }
