appId: com.wojciechturek.pitwall
productName: Pitwall
directories:
  output: release
# out/** includes the host (out/host/index.js), which the app runs as `ELECTRON_RUN_AS_NODE=1 <its own executable>`
# from inside app.asar. That needs Electron's RunAsNode fuse enabled: the default, as long as no `electronFuses`
# setting here turns it off.
files:
  - out/**
  - package.json
asarUnpack:
  - '**/node_modules/node-pty/**'
extraResources:
  - from: resources
    to: resources
artifactName: Pitwall-${version}-${arch}.${ext}
mac:
  target:
    - target: dir
      arch: arm64
  # Ad-hoc signature: no Developer ID. It keeps the bundle internally consistent so a downloaded DMG is not "damaged".
  identity: "-"
  hardenedRuntime: false
dmg:
  title: "Pitwall ${version}"
# Windows (beta): an unsigned NSIS installer per architecture, built one arch per run (`pnpm dist:win --x64`, or
# `--arm64`; both in one run would make a single installer holding both). The Windows scripts pass
# -c.npmRebuild=false: node-pty ships N-API prebuilds for win32-x64 and win32-arm64 that Electron loads as they are,
# so nothing is compiled (and arm64 builds on an x64 machine). node-pty is unpacked from app.asar (above); its ConPTY
# worker thread and console-list helper run from there. The .ps1 hook and status line scripts travel in
# extraResources, outside app.asar, and the app copies them to its data dir, as on macOS.
# build/icon.ico comes from scripts/make-icon-ico.sh; scripts/verify-windows.mjs checks a build.
win:
  target: nsis
  icon: build/icon.ico
  # node-pty's sources, its macOS binaries and its test files aren't needed on Windows (debug symbols, .pdb, are
  # never packed). Both win32 prebuilds stay: they are small without their symbols.
  files:
    - '!**/node_modules/node-pty/prebuilds/darwin-*{,/**}'
    - '!**/node_modules/node-pty/{deps,src,third_party,scripts,build}{,/**}'
    - '!**/node_modules/node-pty/binding.gyp'
    - '!**/node_modules/node-pty/lib/**/*.{test.js,map}'
nsis:
  artifactName: Pitwall-${version}-${arch}-setup.${ext}
  # Per user, into %LOCALAPPDATA%\Programs\pitwall (one-click installs use the package name): no administrator rights
  # and no options. A Pitwall already running from there (its host too) is stopped first, after asking.
  oneClick: true
  perMachine: false
  createStartMenuShortcut: true
  createDesktopShortcut: false
  shortcutName: Pitwall
  # Projects, sessions and their logs stay in %APPDATA%\pitwall across updates and reinstalls.
  deleteAppDataOnUninstall: false
