  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="3"/>
  <rect x="210" y="210" width="284" height="284" rx="46" fill="url(#pane)" stroke="#3a3733" stroke-width="6"/><circle cx="272" cy="276" r="22" fill="#5b9cf5"/><circle cx="272" cy="276" r="34" fill="none" stroke="#5b9cf5" stroke-opacity=".28" stroke-width="8"/><rect x="254" y="344" width="196" height="22" rx="11" fill="#55504a"/><rect x="254" y="392" width="150" height="22" rx="11" fill="#55504a"/><rect x="254" y="440" width="172" height="22" rx="11" fill="#55504a"/><rect x="530" y="210" width="284" height="284" rx="46" fill="url(#pane)" stroke="#d9a66b" stroke-width="12"/><circle cx="592" cy="276" r="22" fill="#f0a34b"/><circle cx="592" cy="276" r="34" fill="none" stroke="#f0a34b" stroke-opacity=".28" stroke-width="8"/><rect x="574" y="344" width="180" height="22" rx="11" fill="#55504a"/><rect x="574" y="392" width="200" height="22" rx="11" fill="#55504a"/><rect x="574" y="440" width="120" height="22" rx="11" fill="#d9a66b"/><rect x="210" y="530" width="284" height="284" rx="46" fill="url(#pane)" stroke="#3a3733" stroke-width="6"/><circle cx="272" cy="596" r="22" fill="#5cc28a"/><circle cx="272" cy="596" r="34" fill="none" stroke="#5cc28a" stroke-opacity=".28" stroke-width="8"/><rect x="254" y="664" width="160" height="22" rx="11" fill="#55504a"/><rect x="254" y="712" width="196" height="22" rx="11" fill="#55504a"/><rect x="254" y="760" width="140" height="22" rx="11" fill="#55504a"/><rect x="530" y="530" width="284" height="284" rx="46" fill="url(#pane)" stroke="#3a3733" stroke-width="6"/><circle cx="592" cy="596" r="22" fill="#6b6762"/><rect x="574" y="664" width="190" height="22" rx="11" fill="#55504a"/><rect x="574" y="712" width="130" height="22" rx="11" fill="#55504a"/><rect x="574" y="760" width="168" height="22" rx="11" fill="#55504a"/>
